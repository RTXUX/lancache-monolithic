user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

http {
    lua_package_path "/usr/share/lua/5.1/?.lua;;";
    resolver @@UPSTREAM_DNS@@ ipv6=off valid=60s;
    resolver_timeout 5s;
    log_format fetch '$remote_addr "$request" $status $body_bytes_sent '
                     'upstream=$upstream_addr redirects=$redirect_count';
    access_log /dev/stdout fetch;
    error_log /dev/stderr warn;
    gzip off;

    server {
        listen 8080;
        recursive_error_pages on;
        error_page 301 302 303 307 308 = @follow_redirect;

        proxy_http_version 1.1;
        proxy_set_header Host $target_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $forward_authorization;
        proxy_set_header Cookie $forward_cookie;
        proxy_set_header X-Lancache-Cacheable "";
        proxy_ssl_server_name on;
        proxy_ssl_name $target_tls_name;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_intercept_errors on;
        proxy_redirect off;
        add_header X-Upstream-Redirects $redirect_count always;

        location = /_health {
            set $redirect_count 0;
            access_log off;
            return 200 "ok\n";
        }

        location / {
            set $target_url "@@UPSTREAM_SCHEME@@://@@UPSTREAM_ADDRESS@@$request_uri";
            set $target_host "@@UPSTREAM_HOST@@";
            set $target_tls_name "@@UPSTREAM_TLS_NAME@@";
            set $redirect_count 0;
            set $redirect_limit @@MAX_REDIRECTS@@;
            set $forward_authorization $http_authorization;
            set $forward_cookie $http_cookie;
            proxy_pass $target_url;
        }

        location @follow_redirect {
            rewrite_by_lua_file /etc/lancache/nginx/redirect.lua;
            proxy_pass $target_url;
        }
    }
}
