services:
  ats:
    image: steam-lancache-ats:local
    build:
      context: .
      target: ats
    restart: unless-stopped
    ports:
      - "${LISTEN_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    environment:
      CACHE_SIZE: ${CACHE_SIZE:-100G}
      RAM_CACHE_SIZE: ${RAM_CACHE_SIZE:-256M}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-2592000}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-dl.steam.clngaa.com}
      UPSTREAM_PORT: ${UPSTREAM_PORT:-80}
      UPSTREAM_SCHEME: ${UPSTREAM_SCHEME:-http}
      UPSTREAM_DNS: ${UPSTREAM_DNS:-1.1.1.1 1.0.0.1}
      MAX_REDIRECTS: ${MAX_REDIRECTS:-5}
      REDIRECT_ACTIONS: ${REDIRECT_ACTIONS:-routable:follow,default:reject}
      OPEN_READ_RETRIES: ${OPEN_READ_RETRIES:-100}
      OPEN_READ_RETRY_MS: ${OPEN_READ_RETRY_MS:-50}
      RWW_RETRIES: ${RWW_RETRIES:-100}
      RWW_RETRY_MS: ${RWW_RETRY_MS:-50}
      ATS_THREADS: ${ATS_THREADS:-4}
    volumes:
      - ${CACHE_DIR:-./cache}:/var/lib/lancache
    stop_grace_period: 60s
